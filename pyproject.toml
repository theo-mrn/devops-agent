[project]
name = "devops-agent"
version = "0.7.0"
description = "Agent DevOps : RAG et diagnostic d'infrastructure en lecture seule"
requires-python = ">=3.12"
# Le nécessaire pour l'agent : appels API et manifests. Léger.
dependencies = [
    "anthropic>=0.40",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Recherche documentaire : embeddings et reranking. ~2 Go de dépendances,
# inutiles pour un agent qui ne fait que du diagnostic cluster.
rag = [
    "ollama>=0.4",
    "rank-bm25>=0.2",
    "sentence-transformers>=3",
]
# Index vectoriel en base : l'agent n'a besoin que de psycopg pour
# interroger pgvector, pas de PyTorch. C'est ce qui garde son image à
# 66 Mo là où l'indexeur en pèse 2,5 Go.
db = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
devops-agent = "devops_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devops_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]
