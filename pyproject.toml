[project]
name = "devops-agent"
version = "0.1.0"
description = "Agent DevOps : RAG et diagnostic d'infrastructure en lecture seule"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "ollama>=0.4",
    "pyyaml>=6",
    "rank-bm25>=0.2",
    "sentence-transformers>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
devops-agent = "devops_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devops_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
