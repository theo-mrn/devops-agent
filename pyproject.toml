[project]
name = "devops-agent"
version = "0.7.1"
description = "Agent DevOps : RAG et diagnostic d'infrastructure en lecture seule"
requires-python = ">=3.12"
# Le nécessaire pour l'agent : appels API, manifests, et l'accès à
# l'index vectoriel. psycopg pèse ~5 Mo, là où sentence-transformers
# en pèserait 2500 : c'est tout l'intérêt de l'index en base.
dependencies = [
    "anthropic>=0.40",
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Recherche documentaire : embeddings et reranking. ~2 Go de dépendances,
# inutiles pour un agent qui ne fait que du diagnostic cluster.
rag = [
    "ollama>=0.4",
    "rank-bm25>=0.2",
    "sentence-transformers>=3",
]
# Conservé pour compatibilité : psycopg est désormais une dépendance
# de base, puisque l'agent interroge l'index en permanence.
db = []
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
devops-agent = "devops_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devops_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]
