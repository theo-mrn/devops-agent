name: Publication

# Publie l'image sur GHCR à chaque tag de version.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Le GITHUB_TOKEN fourni par Actions porte déjà `write:packages` : aucun
# jeton personnel à créer, aucune portée à ajouter à la main.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, ex. 0.1.0"
        required: true

env:
  # Docker Hub : les images y sont publiques par défaut, donc tirables
  # par un cluster sans imagePullSecret. GHCR crée les packages en privé
  # même depuis un dépôt public, ce qui bloque le déploiement.
  IMAGE: maxwellfaraday/devops-agent

jobs:
  publier:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5

      - name: Tests avant publication
        # Une image publiée est une image que quelqu'un déploiera :
        # elle ne part pas sans que la suite soit verte.
        run: |
          uv sync --extra dev
          uv run pytest tests/ -q

      - name: Vérifier que le tag correspond à pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          projet=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [[ "$tag" != "$projet" ]]; then
            echo "Le tag v${tag} ne correspond pas à la version ${projet}" >&2
            exit 1
          fi
          echo "Version cohérente : ${projet}"

      - uses: docker/setup-buildx-action@v3

      - name: Authentification Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Construire et publier l'agent
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 seul : les nœuds Kubernetes sont rarement en arm64, et
          # une image multi-plateforme double le temps de construction.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Étiquettes de l'indexeur
        id: meta-rag
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Suffixe -rag : même version, dépendances d'indexation.
          flavor: |
            suffix=-rag,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Construire et publier l'indexeur
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rag
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-rag.outputs.tags }}
          labels: ${{ steps.meta-rag.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résumé
        run: |
          {
            echo "## Image publiée"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "### Déployer"
            echo '```bash'
            echo "kubectl set image deployment/devops-agent \\"
            echo "  agent=${{ env.IMAGE }}:${GITHUB_REF#refs/tags/v} \\"
            echo "  -n devops-agent"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
