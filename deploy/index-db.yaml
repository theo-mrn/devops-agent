# Index vectoriel dans le cluster.
#
# Pourquoi une base plutôt qu'un fichier dans l'image :
#
#   - l'index contient le TEXTE des chunks, donc les manifests d'un
#     dépôt privé : l'embarquer dans une image publique les exposerait ;
#   - le lire supposerait de charger PyTorch dans le pod de l'agent,
#     soit ~2,5 Go pour un agent qui pèse 66 Mo ;
#   - il faudrait le régénérer et redéployer à chaque changement.
#
# Ici, un CronJob alimente la base depuis le cluster. Rien ne sort,
# rien n'est embarqué, et l'index suit le dépôt automatiquement.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: agent-index
  namespace: devops-agent
spec:
  instances: 1
  # pgvector est présent dans l'image standard CloudNativePG :
  # aucune image personnalisée nécessaire.
  imageName: ghcr.io/cloudnative-pg/postgresql:16

  bootstrap:
    initdb:
      database: index
      owner: agent
      # Le Secret doit être de type kubernetes.io/basic-auth ; il est
      # créé par installer-index.sh, avec un mot de passe généré
      # localement qui ne transite nulle part.
      secret:
        name: agent-index-credentials
      # postInitSQL s'exécute sur la base `postgres`, pas sur celle de
      # l'application : c'est `postInitApplicationSQL` qu'il faut ici.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;

  storage:
    size: 2Gi
    storageClass: local-path

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
---
# Le CronJob a besoin de lire le dépôt GitOps.
#
# Le clone se fait en HTTPS avec un token, et non en SSH : un conteneur
# non-root sans utilisateur déclaré dans /etc/passwd fait échouer ssh
# avec « No user exists for uid 10001 ». HTTPS n'a pas cette contrainte.
#
# Créer un token à portée restreinte — GitHub : Settings → Developer
# settings → Personal access tokens → Fine-grained, avec le seul droit
# « Contents: Read-only » sur ce dépôt — puis :
#
#   kubectl create secret generic agent-index-git \
#     --from-literal=token=github_pat_... -n devops-agent
---
# Cache des poids de modèles, partagé entre exécutions.
#
# 10 Gi : 3,4 Go de poids, plus la marge des fichiers temporaires que
# HuggingFace écrit pendant le téléchargement — il écrit un .incomplete
# avant de renommer, donc il faut deux fois la place.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-index-modeles
  namespace: devops-agent
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-indexeur
  namespace: devops-agent
spec:
  # Toutes les six heures : un dépôt GitOps ne change pas à la minute.
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Un échec d'indexation n'est pas critique : l'agent continue avec
      # l'index précédent.
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: devops-agent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001

          initContainers:
            # Le clone est isolé dans son propre conteneur : l'indexeur
            # n'a jamais accès au token.
            #
            # HTTPS plutôt que SSH : un conteneur non-root sans
            # utilisateur déclaré dans /etc/passwd fait échouer ssh avec
            # « No user exists for uid 10001 ».
            - name: cloner
              image: alpine/git:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  export HOME=/tmp

                  # Le token n'est injecté qu'au moment du clone, et
                  # masqué dans la sortie.
                  URL=$(echo "$DEPOT" | sed "s#https://#https://x-access-token:${TOKEN}@#")
                  git clone --depth 1 "$URL" /depot 2>&1 | sed "s/${TOKEN}/***/g"

                  # L'origine est réécrite sans le token, au cas où le
                  # dépôt cloné serait inspecté. `safe.directory` est
                  # requis : git refuse d'opérer sur un dépôt appartenant
                  # à un autre uid que le sien.
                  git config --global --add safe.directory /depot
                  git -C /depot remote set-url origin "$DEPOT"

                  echo "cloné : $(find /depot -name '*.yml' | wc -l) manifests"
              env:
                - name: DEPOT
                  valueFrom:
                    configMapKeyRef:
                      name: agent-index-config
                      key: depot
                - name: TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: agent-index-git
                      key: token
              volumeMounts:
                - name: depot
                  mountPath: /depot
                - name: tmp
                  mountPath: /tmp

          containers:
            - name: indexeur
              # Image complète : contient sentence-transformers, contrairement
              # à celle de l'agent qui reste légère.
              image: maxwellfaraday/devops-agent:0.7.1-rag
              command: ["devops-agent", "reindexer"]
              env:
                - name: RAG_INFRA_REPO
                  value: /depot
                - name: RAG_DB_DSN
                  valueFrom:
                    secretKeyRef:
                      # Créé par installer-index.sh : CloudNativePG ne
                      # publie d'URI complète que s'il génère lui-même
                      # le mot de passe.
                      name: agent-index-dsn
                      key: dsn
              resources:
                requests:
                  memory: 1Gi
                  cpu: 500m
                limits:
                  # Le modèle bge-m3 pèse 2,3 Go sur disque, mais son
                  # chargement en float32 plus les tampons d'encodage
                  # dépassent 4 Gi — constaté par un OOMKill.
                  memory: 6Gi
                  cpu: 2000m
              volumeMounts:
                - name: depot
                  mountPath: /depot
                  readOnly: true
                - name: cache
                  mountPath: /home/agent/.cache

          volumes:
            - name: depot
              emptyDir: {}
            # Cache des modèles d'embedding, PERSISTANT.
            #
            # Les poids (bge-m3 2,3 Go + reranker 1,1 Go) ne sont pas
            # dans l'image : elle ferait 8 Go. Ils sont téléchargés au
            # premier passage, puis réutilisés.
            #
            # Un emptyDir ne convenait pas : le téléchargement dépassait
            # sa limite et le pod était évincé — « Usage of EmptyDir
            # volume "cache" exceeds the limit », qui remonte en exit 137
            # et se confond aisément avec un manque de mémoire.
            - name: cache
              persistentVolumeClaim:
                claimName: agent-index-modeles
            # Nécessaire au clone : le conteneur a un système de
            # fichiers racine en lecture seule.
            - name: tmp
              emptyDir: {}
# Le ConfigMap `agent-index-config` n'est volontairement PAS ici :
# un `kubectl apply` de ce fichier écraserait sinon le dépôt réel par un
# placeholder. Il est créé par `installer-index.sh` :
#
#   kubectl create configmap agent-index-config \
#     --from-literal=depot=https://github.com/compte/depot.git \
#     -n devops-agent
