# Index vectoriel dans le cluster.
#
# Pourquoi une base plutôt qu'un fichier dans l'image :
#
#   - l'index contient le TEXTE des chunks, donc les manifests d'un
#     dépôt privé : l'embarquer dans une image publique les exposerait ;
#   - le lire supposerait de charger PyTorch dans le pod de l'agent,
#     soit ~2,5 Go pour un agent qui pèse 66 Mo ;
#   - il faudrait le régénérer et redéployer à chaque changement.
#
# Ici, un CronJob alimente la base depuis le cluster. Rien ne sort,
# rien n'est embarqué, et l'index suit le dépôt automatiquement.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: agent-index
  namespace: devops-agent
spec:
  instances: 1
  # pgvector est présent dans l'image standard CloudNativePG :
  # aucune image personnalisée nécessaire.
  imageName: ghcr.io/cloudnative-pg/postgresql:16

  bootstrap:
    initdb:
      database: index
      owner: agent
      secret:
        name: agent-index-credentials
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;

  storage:
    size: 2Gi
    storageClass: local-path

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
---
# Le CronJob a besoin de lire le dépôt GitOps. Une clé de déploiement en
# lecture seule suffit — elle ne donne accès qu'à ce dépôt.
#
#   ssh-keygen -t ed25519 -f cle -N "" -C "devops-agent-indexeur"
#   kubectl create secret generic agent-index-git \
#     --from-file=ssh-privatekey=cle -n devops-agent
#   puis déclarer cle.pub comme deploy key en lecture seule sur GitHub
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-indexeur
  namespace: devops-agent
spec:
  # Toutes les six heures : un dépôt GitOps ne change pas à la minute.
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Un échec d'indexation n'est pas critique : l'agent continue avec
      # l'index précédent.
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: devops-agent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001

          initContainers:
            # Le clone est isolé dans son propre conteneur : l'indexeur
            # n'a jamais accès à la clé SSH.
            - name: cloner
              image: alpine/git:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  mkdir -p ~/.ssh
                  cp /cle/ssh-privatekey ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
                  git clone --depth 1 "$DEPOT" /depot
                  echo "cloné : $(find /depot -name '*.yml' | wc -l) manifests"
              env:
                - name: DEPOT
                  valueFrom:
                    configMapKeyRef:
                      name: agent-index-config
                      key: depot
              volumeMounts:
                - name: cle-git
                  mountPath: /cle
                  readOnly: true
                - name: depot
                  mountPath: /depot

          containers:
            - name: indexeur
              # Image complète : contient sentence-transformers, contrairement
              # à celle de l'agent qui reste légère.
              image: maxwellfaraday/devops-agent:0.7.0-rag
              command: ["devops-agent", "reindexer"]
              env:
                - name: RAG_INFRA_REPO
                  value: /depot
                - name: RAG_DB_DSN
                  valueFrom:
                    secretKeyRef:
                      name: agent-index-app
                      key: uri
              resources:
                requests:
                  memory: 1Gi
                  cpu: 500m
                limits:
                  # L'encodage charge un modèle de 2,3 Go.
                  memory: 4Gi
                  cpu: 2000m
              volumeMounts:
                - name: depot
                  mountPath: /depot
                  readOnly: true
                - name: cache
                  mountPath: /home/agent/.cache

          volumes:
            - name: cle-git
              secret:
                secretName: agent-index-git
                defaultMode: 0400
            - name: depot
              emptyDir: {}
            - name: cache
              emptyDir:
                sizeLimit: 4Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-index-config
  namespace: devops-agent
data:
  # Dépôt GitOps à indexer, en SSH pour utiliser la clé de déploiement.
  depot: "git@github.com:<compte>/<depot>.git"
