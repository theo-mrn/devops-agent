# Déploiement de l'agent en mode autonome.
#
# Il surveille le cluster depuis l'intérieur, avec le ServiceAccount
# défini dans rbac.yaml — aucun kubeconfig à fournir.
#
# Le Secret contenant la clé API n'est DÉLIBÉRÉMENT pas ici : un
# placeholder appliqué par mégarde écraserait la vraie clé, et une clé
# committée serait pire. Le créer avant :
#
#   kubectl create secret generic devops-agent-api \
#     --from-literal=anthropic-api-key=sk-ant-... -n devops-agent
#
# ou laisser deploy/installer.sh s'en charger.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-agent-config
  namespace: devops-agent
data:
  RAG_PROVIDER: "anthropic"
  RAG_LLM_API: "claude-sonnet-5"
  # Plafonds de dépense : par diagnostic, et sur 24 h glissantes.
  RAG_BUDGET_MAX: "0.50"
  RAG_BUDGET_JOUR: "5.0"
  # Filtres de surveillance.
  RAG_SEUIL_PAR_JOUR: "2.0"
  # 6 h : une anomalie structurelle n'a pas à être rediagnostiquée
  # toutes les demi-heures.
  RAG_DEDUP_SECONDES: "21600"
  # Seuil de transmission : « surveillance » enverrait aussi le bruit
  # de fond (jobs éphémères, replicas temporairement incomplets).
  RAG_WEBHOOK_GRAVITE: "grave"
  # Destinations par gravité. Une gravité sans URL propre retombe sur
  # RAG_WEBHOOK_URL, et le seuil ci-dessus ne filtre que celle-là.
  # RAG_WEBHOOK_URL_CRITIQUE: "http://n8n.n8n.svc.cluster.local:5678/webhook/urgences"
  # RAG_WEBHOOK_URL_GRAVE: "http://n8n.n8n.svc.cluster.local:5678/webhook/incidents"
  # RAG_WEBHOOK_URL_SURVEILLANCE: "http://n8n.n8n.svc.cluster.local:5678/webhook/journal"
  RAG_FENETRE_CORRELATION: "8.0"
  # Restreindre la surveillance à certains namespaces :
  # RAG_NAMESPACES: "prod,staging"

  # Envoi des rapports vers un webhook. Sans cela, ils restent dans les
  # logs du pod et dans /data/diagnostics.jsonl.
  # RAG_WEBHOOK_URL: "http://n8n.n8n.svc.cluster.local:5678/webhook/diagnostics"
  # RAG_WEBHOOK_GRAVITE: "surveillance"   # ou grave / critique
  # Nom du cluster, repris dans chaque rapport :
  # RAG_CLUSTER_NOM: "prod-eu-west"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-agent
  namespace: devops-agent
spec:
  # Une seule instance : deux agents diagnostiqueraient deux fois le
  # même incident, et doubleraient la facture.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: devops-agent
  template:
    metadata:
      labels:
        app: devops-agent
    spec:
      serviceAccountName: devops-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: agent
          # Docker Hub : les images y sont publiques par défaut, donc
          # tirables par le cluster sans imagePullSecret.
          image: maxwellfaraday/devops-agent:0.4.0
          imagePullPolicy: IfNotPresent
          args: ["auto"]
          envFrom:
            - configMapRef:
                name: devops-agent-config
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: devops-agent-api
                  key: anthropic-api-key
            # Journal des diagnostics, sur le volume persistant.
            - name: RAG_JOURNAL
              value: /data/diagnostics.jsonl
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              # L'agent charge un modèle d'embedding pour le RAG :
              # 2Gi est le minimum confortable.
              memory: 2Gi
              cpu: 1000m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: donnees
              mountPath: /data
            - name: cache
              mountPath: /home/agent/.cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: donnees
          persistentVolumeClaim:
            claimName: devops-agent-data
        # Le cache des modèles d'embedding : volumineux, régénérable.
        - name: cache
          emptyDir:
            sizeLimit: 4Gi
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devops-agent-data
  namespace: devops-agent
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
