# Accès en lecture seule au cluster.
#
# La sûreté de l'agent repose sur deux couches indépendantes :
#
#   1. ce RBAC — le serveur d'API REFUSE toute écriture, quelle que
#      soit la commande émise, même si le code était contourné ;
#   2. le code — liste blanche de verbes kubectl et blocage des
#      ressources sensibles, couverts par des tests.
#
# C'est la première qu'une équipe infra lira avant d'autoriser le
# déploiement : elle tient en une règle.
---
apiVersion: v1
kind: Namespace
metadata:
  name: devops-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-agent
  namespace: devops-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devops-agent-readonly
rules:
  # ─────────────────────────────────────────────────────────────
  # Lecture seule sur l'ensemble du cluster.
  #
  # Énumérer les ressources ne tient pas pour un outil distribuable :
  # chaque cluster a ses opérateurs — CloudNativePG, cert-manager,
  # Argo CD, Traefik — et personne n'éditera un ClusterRole avant
  # d'installer.
  #
  # Le joker porte sur les RESSOURCES, jamais sur les VERBES. La
  # sûreté vient de « get, list, watch » : aucune écriture n'est
  # possible, quelle que soit la ressource, présente ou future.
  #
  # ⚠️ Ce joker inclut les Secrets — Kubernetes ne sait pas exclure
  # une ressource d'un joker. Leur blocage vit dans le code
  # (RESSOURCES_INTERDITES, agent/tools.py), couvert par des tests :
  #
  #     le RBAC empêche toute ÉCRITURE
  #     le code empêche la LECTURE de ce qui ne doit pas sortir
  #
  # Un déploiement qui exige que les Secrets soient inaccessibles au
  # niveau du serveur d'API doit remplacer cette règle par une
  # énumération explicite des ressources — au prix de la maintenir.
  # ─────────────────────────────────────────────────────────────
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # ─────────────────────────────────────────────────────────────
  # DÉLIBÉRÉMENT ABSENTS
  #
  #   create, update, patch, delete, deletecollection
  #     → aucune modification du cluster
  #
  #   escalate, bind, impersonate
  #     → aucune élévation de privilège
  #
  # Les sous-ressources d'exécution (pods/exec, pods/portforward,
  # pods/attach) ne s'utilisent qu'avec `create` : elles sont donc
  # inaccessibles.
  #
  # Vérifiable à tout moment :
  #   kubectl auth can-i delete pods \
  #     --as=system:serviceaccount:devops-agent:devops-agent   → no
  # ─────────────────────────────────────────────────────────────
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devops-agent-readonly
subjects:
  - kind: ServiceAccount
    name: devops-agent
    namespace: devops-agent
roleRef:
  kind: ClusterRole
  name: devops-agent-readonly
  apiGroup: rbac.authorization.k8s.io
