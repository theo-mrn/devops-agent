# Accès en lecture seule au cluster.
#
# La sûreté de l'agent repose sur deux couches indépendantes :
#
#   1. le code — liste blanche de verbes kubectl, couverte par 20 tests ;
#   2. ce RBAC — le serveur d'API REFUSE toute écriture, quelle que soit
#      la commande émise.
#
# La seconde tient même si la première est contournée. C'est elle qu'une
# équipe infra lira avant d'autoriser le déploiement.
---
apiVersion: v1
kind: Namespace
metadata:
  name: devops-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-agent
  namespace: devops-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devops-agent-readonly
rules:
  # Ressources fondamentales. `pods/log` est requis pour lire les logs,
  # `watch` pour la surveillance par événements.
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - services
      - endpoints
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - configmaps
    verbs: ["get", "list", "watch"]

  # Charges de travail.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]

  # Tâches planifiées.
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]

  # Réseau.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]

  # Métriques, pour comparer consommation réelle et limites configurées.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]

  # Perturbations volontaires, utiles au diagnostic d'éviction.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]

  # ─────────────────────────────────────────────────────────────
  # Ressources personnalisées des opérateurs.
  #
  # Sans elles, l'agent bute sur ce qu'il diagnostique : un pod géré
  # par CloudNativePG n'a de sens qu'au regard du Cluster qui le
  # définit. Constaté en conditions réelles — l'agent avait signalé
  # « accès à la ressource Cluster refusé, impossible de confirmer le
  # nombre d'instances déclaré ».
  #
  # Ce sont des LECTURES : aucune atteinte au principe de lecture
  # seule. Les groupes sont nommés explicitement plutôt qu'avec un
  # joker, pour que l'ajout d'un opérateur reste une décision.
  # ─────────────────────────────────────────────────────────────

  # CloudNativePG — clusters PostgreSQL, sauvegardes, points de bascule.
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "scheduledbackups", "poolers"]
    verbs: ["get", "list"]

  # Argo CD — état de synchronisation et santé des applications.
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applicationsets", "appprojects"]
    verbs: ["get", "list"]

  # Prometheus Operator — règles d'alerte et cibles de collecte.
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - prometheuses
      - prometheusrules
      - servicemonitors
      - podmonitors
      - alertmanagers
    verbs: ["get", "list"]

  # Traefik — routage : un service injoignable vient souvent d'ici.
  - apiGroups: ["traefik.io", "traefik.containo.us"]
    resources: ["ingressroutes", "middlewares", "serverstransports", "tlsoptions"]
    verbs: ["get", "list"]

  # cert-manager — certificats expirés ou non renouvelés.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "certificaterequests", "issuers", "clusterissuers"]
    verbs: ["get", "list"]

  # Trivy Operator — rapports de vulnérabilité et de configuration.
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["vulnerabilityreports", "configauditreports", "clustercompliancereports"]
    verbs: ["get", "list"]

  # Snapshots de volumes — restauration après incident de stockage.
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots", "volumesnapshotcontents", "volumesnapshotclasses"]
    verbs: ["get", "list"]

  # Helm (k3s) — état des déploiements pilotés par chart.
  - apiGroups: ["helm.cattle.io"]
    resources: ["helmcharts", "helmchartconfigs"]
    verbs: ["get", "list"]

  # ─────────────────────────────────────────────────────────────
  # DÉLIBÉRÉMENT ABSENTS
  #
  #   secrets            — leur contenu est encodé en base64, donc lisible
  #   create/update/patch/delete  — aucun verbe d'écriture
  #   pods/exec, pods/portforward — aucune exécution dans un conteneur
  #   */scale            — aucune modification de dimensionnement
  #
  # Un `kubectl auth can-i` le confirme :
  #   kubectl auth can-i delete pods \
  #     --as=system:serviceaccount:devops-agent:devops-agent   → no
  # ─────────────────────────────────────────────────────────────
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devops-agent-readonly
subjects:
  - kind: ServiceAccount
    name: devops-agent
    namespace: devops-agent
roleRef:
  kind: ClusterRole
  name: devops-agent-readonly
  apiGroup: rbac.authorization.k8s.io
